<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Mishaling</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FBF5EA">
<meta name="color-scheme" content="light dark">
<meta name="darkreader-lock">
<link rel="icon" href="icon2-192.png">
<link rel="apple-touch-icon" href="mishaling-apple-touch.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#FBF5EA; --surface:#FFFDF8; --ink:#3A2A1F; --muted:#86705E; --line:#EADCC6; --chip:#F6EAD6;
  --primary:#D9692B; --primary-lip:#A64E1C; --on-primary:#FFFFFF;
  --sun:#FFC43D; --sun-lip:#D39516; --on-sun:#3A2A00;
  --good:#3CAA5E; --good-lip:#2C8447; --good-bg:#DFF3DF; --good-ink:#1F6E37;
  --bad:#E5533F; --bad-lip:#B83B2A; --bad-bg:#FBE1DC; --bad-ink:#A32F1F;
  --berry:#E8507A; --lock:#D9CBB7; --leaf:#6E9F45; --leaf-lip:#557D33;
  --radius:18px;
  --font-head:"Rubik", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --font-body:"Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root[data-theme="auto"]{
    color-scheme: dark;
    --bg:#1C1612; --surface:#28201A; --ink:#F6EDE2; --muted:#BBA58E; --line:#3D3128; --chip:#33281F;
    --primary:#E9884A; --primary-lip:#B9622A;
    --good-bg:#1F3A26; --good-ink:#8FE0A6; --bad-bg:#45231F; --bad-ink:#FF9C90; --lock:#4A3D33;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#1C1612; --surface:#28201A; --ink:#F6EDE2; --muted:#BBA58E; --line:#3D3128; --chip:#33281F;
  --primary:#E9884A; --primary-lip:#B9622A;
  --good-bg:#1F3A26; --good-ink:#8FE0A6; --bad-bg:#45231F; --bad-ink:#FF9C90; --lock:#4A3D33;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
#app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.hidden{display:none!important}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px}

/* Buttons */
.btn{appearance:none;border:0;border-radius:var(--radius);padding:14px 20px;font-family:var(--font-head);font-weight:700;font-size:18px;cursor:pointer;background:var(--primary);color:var(--on-primary);box-shadow:0 5px 0 var(--primary-lip);transition:transform .06s,box-shadow .06s;width:100%}
.btn:active:not(:disabled){transform:translateY(5px);box-shadow:0 0 0 var(--primary-lip)}
.btn:disabled{background:var(--line);color:var(--muted);box-shadow:0 5px 0 var(--lock);cursor:default}
.btn.good{background:var(--good);box-shadow:0 5px 0 var(--good-lip)}
.btn.bad{background:var(--bad);box-shadow:0 5px 0 var(--bad-lip)}
.btn.sun{background:var(--sun);color:var(--on-sun);box-shadow:0 5px 0 var(--sun-lip)}
.btn.ghost{background:var(--surface);color:var(--primary);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.small{padding:10px 14px;font-size:16px;width:auto}
.iconbtn{appearance:none;border:0;background:none;cursor:pointer;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;color:var(--muted)}
.iconbtn:hover{background:var(--chip)}

/* Home */
.top{display:flex;align-items:center;gap:10px;padding:12px 16px}
.stat{display:flex;align-items:center;gap:6px;font-family:var(--font-head);font-weight:700;font-size:18px;padding:6px 10px;border-radius:14px;background:var(--surface);border:2px solid var(--line)}
.top .grow{flex:1}
.greet{display:flex;align-items:flex-end;gap:12px;padding:6px 16px 0}
.greet svg{width:96px;height:96px;flex:none}
.bubble{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:12px 14px;font-weight:700;margin-bottom:22px}
.bubble::after{content:"";position:absolute;left:-10px;bottom:16px;width:16px;height:16px;background:var(--surface);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.unitcard{margin:12px 16px 4px;border-radius:24px;padding:18px 18px 16px;background:var(--primary);color:var(--on-primary);box-shadow:0 6px 0 var(--primary-lip);display:flex;gap:12px;align-items:center}
.unitcard .t{flex:1}
.unitcard small{display:block;opacity:.85;font-weight:700}
.unitcard h1{margin:2px 0 0;font-family:var(--font-head);font-size:26px;line-height:1.1}
.unitcard .gb{background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.4);color:#fff;border-radius:16px;padding:10px 12px;font-weight:800;cursor:pointer;font-family:var(--font-head)}
.path{position:relative;padding:44px 0 40px;display:flex;flex-direction:column;align-items:center;gap:22px}
.node{display:flex;flex-direction:column;align-items:center;gap:8px;position:relative}
.node .ring{width:106px;height:106px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--sun) calc(var(--p)*1%), var(--line) 0)}
.node button{width:76px;height:76px;border-radius:50%;border:0;cursor:pointer;font-size:32px;background:var(--primary);box-shadow:0 6px 0 var(--primary-lip);transition:transform .06s,box-shadow .06s}
.node .ring>button{transform:translateY(-3px)}
.node button:active,.node .ring>button:active{transform:translateY(3px);box-shadow:none}
.node.done button{background:var(--sun);box-shadow:0 6px 0 var(--sun-lip)}
.node.locked button{background:var(--lock);box-shadow:0 6px 0 var(--line);cursor:default;filter:grayscale(1)}
.node .lbl{font-family:var(--font-head);font-weight:700;font-size:15px;text-align:center}
.node .lbl span{display:block;color:var(--muted);font-family:var(--font-body);font-size:14px}
.node.current::before{content:"Start";position:absolute;top:-30px;background:var(--surface);border:2px solid var(--line);color:var(--primary);font-family:var(--font-head);font-weight:800;font-size:14px;padding:4px 12px;border-radius:12px;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.foot-note{color:var(--muted);font-size:14px;text-align:center;padding:0 24px 28px}

/* Lesson */
.lessonbar{display:flex;align-items:center;gap:10px;padding:10px 12px}
.progress{flex:1;height:18px;border-radius:999px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--good);border-radius:999px;transition:width .35s;box-shadow:inset 0 -5px 0 rgba(0,0,0,.08)}
.body{flex:1;padding:8px 18px 210px;display:flex;flex-direction:column;gap:16px}
.prompt{font-family:var(--font-head);font-weight:700;font-size:23px;margin:6px 0 0}
.sub{color:var(--muted);margin:-8px 0 0;font-weight:700}
.say{display:flex;align-items:center;gap:12px}
.speaker{flex:none;width:58px;height:58px;border-radius:18px;border:0;background:var(--primary);color:#fff;font-size:26px;cursor:pointer;box-shadow:0 5px 0 var(--primary-lip)}
.speaker.slow{width:46px;height:46px;font-size:20px;background:var(--chip);color:var(--primary);box-shadow:0 4px 0 var(--line)}
.speaker:active{transform:translateY(4px);box-shadow:none}
.updbar{position:fixed;left:50%;transform:translateX(-50%);width:min(536px, calc(100% - 24px));box-sizing:border-box;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;align-items:center;gap:10px;padding:10px 12px 10px 16px;border-radius:16px;background:var(--ink);color:var(--bg);font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.updbar span{flex:1}.updbar button{border:0;border-radius:12px;padding:9px 14px;font:inherit;font-weight:800;background:var(--primary);color:#fff}
.ru{font-family:var(--font-body);font-weight:800;font-size:28px;line-height:1.2}
.ru.big{font-size:44px}
.tr{color:var(--muted);font-weight:700;font-size:16px}
.bigpic{font-size:88px;line-height:1;text-align:center}
.card{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.opts{display:grid;gap:12px}
.opts.grid2{grid-template-columns:1fr 1fr}
.opt{appearance:none;cursor:pointer;background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;border-radius:var(--radius);padding:14px;font-weight:800;font-size:19px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.opt .pic{font-size:52px;line-height:1}
.opt .en{color:var(--muted);font-size:15px}
.opt[aria-pressed="true"]{border-color:var(--primary);background:var(--chip);color:var(--primary)}
.opt.ok{border-color:var(--good);background:var(--good-bg);color:var(--good-ink)}
.opt.no{border-color:var(--bad);background:var(--bad-bg);color:var(--bad-ink);animation:shake .3s}
.opt.gone{opacity:.35;pointer-events:none}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.match .col{display:grid;gap:12px}
.answer{min-height:64px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding:6px 0 12px}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding-top:8px}
.tile{appearance:none;cursor:pointer;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:9px 14px;font-weight:800;font-size:19px}
.tile.used{color:transparent;background:var(--line);border-color:var(--line);pointer-events:none}
.blank{display:inline-block;min-width:80px;border-bottom:3px solid var(--primary);margin:0 4px;text-align:center;color:var(--primary)}
.rec{display:flex;flex-direction:column;gap:12px;align-items:center}
.recbtn{width:96px;height:96px;border-radius:50%;border:0;cursor:pointer;font-size:40px;background:var(--berry);color:#fff;box-shadow:0 6px 0 #B5345A}
.recbtn.on{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 6px 0 #B5345A,0 0 0 12px rgba(232,80,122,.25)}}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.note{color:var(--muted);font-size:15px;text-align:center}
.story{display:flex;flex-direction:column;gap:12px}
.line{display:flex;gap:10px;align-items:flex-end}
.line.right{flex-direction:row-reverse}
.line .av{width:48px;height:48px;flex:none;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:28px;overflow:hidden}
.line .av svg{width:52px;height:52px}
.line .bub{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:10px 12px;cursor:pointer;text-align:left}
.line .bub b{font-size:19px}
.line .bub small{display:block;color:var(--muted);font-weight:700}
.line.new .bub{border-color:var(--primary)}

/* Bottom bar & feedback */
.footer{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:2px solid var(--line);padding:14px 18px calc(14px + env(safe-area-inset-bottom,0px))}
.footer .inner{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.footer.ok{background:var(--good-bg);border-color:transparent}
.footer.no{background:var(--bad-bg);border-color:transparent}
.fb{display:flex;gap:12px;align-items:center}
.fb svg{width:56px;height:56px;flex:none}
.fb h3{margin:0;font-family:var(--font-head);font-size:22px}
.footer.ok h3{color:var(--good-ink)}
.footer.no h3{color:var(--bad-ink)}
.fb p{margin:2px 0 0;font-weight:700}
.footer.no .fb p{color:var(--bad-ink)}
.footer.ok .fb p{color:var(--good-ink)}

/* End screen */
.end{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px 22px 140px;text-align:center}
.end svg.m{width:170px;height:170px}
.end h2{margin:0;font-family:var(--font-head);font-size:30px}
.stars{display:flex;gap:10px;font-size:46px}
.stars span{opacity:.18;transform:scale(.6);transition:transform .35s cubic-bezier(.3,1.6,.5,1),opacity .35s}
.stars span.lit{opacity:1;transform:scale(1)}
.tiles3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.tiles3 div{border:2px solid var(--line);border-radius:16px;padding:10px 6px;background:var(--surface)}
.tiles3 b{display:block;font-family:var(--font-head);font-size:22px}
.tiles3 small{color:var(--muted);font-weight:700}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px;animation:fall 1.8s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}

/* Sheets */
.sheet-bg{position:fixed;inset:0;background:rgba(10,15,30,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:85vh;max-height:85dvh;overflow:auto;border-radius:26px 26px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet h2{font-family:var(--font-head);margin:0 0 12px;font-size:24px}
.sheet h3{font-family:var(--font-head);margin:18px 0 8px;font-size:18px}
.wordrow{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:2px solid var(--line)}
.wordrow .p{font-size:30px;width:40px;text-align:center}
.wordrow .w{flex:1}
.wordrow .w b{font-size:20px}
.wordrow .w small{display:block;color:var(--muted);font-weight:700}
.tip{background:var(--chip);border-radius:16px;padding:12px 14px;margin:8px 0;font-weight:600}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:2px solid var(--line);font-weight:700}
.toggle input{width:26px;height:26px;accent-color:var(--primary)}

/* Chipmunk & new screens */
img.chip{display:block;height:auto;user-select:none;-webkit-user-drag:none}
.greet img.chip{width:104px;flex:none}
.fb img.chip{width:58px;flex:none}
.end img.chip.m{width:180px}
.line .av img.chip{width:46px}
.line .who{display:block;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:2px}
img.chip.mama{filter:hue-rotate(-18deg) saturate(1.25) brightness(1.06)}
img.chip.papa{filter:brightness(.8) saturate(.85)}
.tag{display:flex;align-items:center;gap:8px;font-family:var(--font-head);font-weight:800;font-size:14px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:-8px}
.tag i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:13px}
.tag.new{color:#9B5DE5}.tag.new i{background:#9B5DE5}
.tag.mistake{color:#F08A00}.tag.mistake i{background:#F08A00}
.barwrap{flex:1;position:relative}
.combo-lbl{position:absolute;left:12px;top:-15px;font-family:var(--font-head);font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.progress.gold i{background:var(--sun)}.combo-lbl.gold{color:var(--sun-lip)}
.progress.orange i{background:#FF8A1F}.combo-lbl.orange{color:#E06C00}
.splash{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px 22px 140px;text-align:center}
.splash img.chip{width:190px}
.splash .bubble{margin:0}.splash .bubble::after{left:50%;bottom:-10px;transform:translateX(-50%) rotate(-45deg)}
.streakscreen{background:#FF9F1C;color:#fff}
.streakscreen .num{font-family:var(--font-head);font-weight:800;font-size:96px;line-height:1;color:#FFF3C4}
.streakscreen h2{margin:0;font-family:var(--font-head);font-size:28px;color:#FFF3C4}
.week{display:flex;gap:8px;justify-content:center}
.week div{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800;font-size:14px}
.week span{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:16px;background:rgba(0,0,0,.14);color:#fff}
.week span.on{background:#FFE08A;color:#C86A00}
.week span.today{background:#fff;color:#E07800}
.tiles3 div{position:relative;padding-top:30px;overflow:hidden}
.tiles3 div em{position:absolute;top:0;left:0;right:0;padding:4px 0;font-style:normal;font-family:var(--font-head);font-weight:800;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:#fff}
.tiles3 .c1{border-color:var(--sun)}.tiles3 .c1 em{background:var(--sun);color:var(--on-sun)}
.tiles3 .c2{border-color:var(--good)}.tiles3 .c2 em{background:var(--good)}
.tiles3 .c3{border-color:var(--primary)}.tiles3 .c3 em{background:var(--primary)}
/* Microsoft Speech results */
.score{display:flex;flex-direction:column;align-items:center;gap:2px}
.score b{font-family:var(--font-head);font-size:44px;line-height:1}
.score span{font-weight:800;color:var(--muted)}
.score.hi b{color:var(--good)}.score.mid b{color:var(--sun-lip)}.score.lo b{color:var(--bad)}
.words{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.wd{border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:8px 10px;background:var(--surface);text-align:center;min-width:64px}
.wd>b{display:block;font-size:22px}
.wd.hi{border-color:var(--good);background:var(--good-bg);color:var(--good-ink)}
.wd.mid{border-color:var(--sun);background:#FFF4D6;color:#8A5A00}
.wd.lo{border-color:var(--bad);background:var(--bad-bg);color:var(--bad-ink)}
.ph{display:flex;gap:3px;justify-content:center;margin-top:5px;flex-wrap:wrap}
.ph i{font-style:normal;font-size:12px;font-weight:800;padding:1px 5px;border-radius:6px;color:#fff}
.ph i.hi{background:var(--good)}.ph i.mid{background:var(--sun-lip)}.ph i.lo{background:var(--bad)}
.legend{font-size:13px;color:var(--muted);text-align:center}
.field{display:flex;flex-direction:column;gap:6px;padding:10px 0;font-weight:700}
.field input,.field select{font:inherit;font-weight:600;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);max-width:92%;background:var(--ink);color:var(--surface);padding:10px 14px;border-radius:14px;font-weight:700;font-size:15px;z-index:30;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.spin{width:38px;height:38px;border:5px solid var(--line);border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite;margin:6px auto}
@keyframes spin{to{transform:rotate(360deg)}}
/* Alphabet */
.unitcard.u2{background:#13A38A;box-shadow:0 6px 0 #0D7A67}
.unitcard.u3{background:#8A5CD1;box-shadow:0 6px 0 #6A43A8}
.popcard.u2{background:#13A38A;box-shadow:0 6px 0 #0D7A67}.popcard.u2::before{background:#13A38A}.popcard.u2 button{color:#0D7A67}
.popcard.u3{background:#8A5CD1;box-shadow:0 6px 0 #6A43A8}.popcard.u3::before{background:#8A5CD1}.popcard.u3 button{color:#6A43A8}
.unitcard.u4{background:#D9547A;box-shadow:0 6px 0 #A83A5C}
.popcard.u4{background:#D9547A;box-shadow:0 6px 0 #A83A5C}.popcard.u4::before{background:#D9547A}.popcard.u4 button{color:#A83A5C}
.unitcard.u5{background:#C9862A;box-shadow:0 6px 0 #9A6418}
.popcard.u5{background:#C9862A;box-shadow:0 6px 0 #9A6418}.popcard.u5::before{background:#C9862A}.popcard.u5 button{color:#9A6418}
.unitcard.u6{background:#2B9FD0;box-shadow:0 6px 0 #1D7AA2}
.popcard.u6{background:#2B9FD0;box-shadow:0 6px 0 #1D7AA2}.popcard.u6::before{background:#2B9FD0}.popcard.u6 button{color:#1D7AA2}
.unitcard.u7{background:#6DAA2C;box-shadow:0 6px 0 #507F1E}
.popcard.u7{background:#6DAA2C;box-shadow:0 6px 0 #507F1E}.popcard.u7::before{background:#6DAA2C}.popcard.u7 button{color:#507F1E}
.unitcard.u8{background:#4B5BD1;box-shadow:0 6px 0 #3443A3}
.popcard.u8{background:#4B5BD1;box-shadow:0 6px 0 #3443A3}.popcard.u8::before{background:#4B5BD1}.popcard.u8 button{color:#3443A3}
.unitcard.u9{background:#C24DB8;box-shadow:0 6px 0 #963A8E}

/* Living Миша */
img.chip{transform-origin:50% 100%;animation:breathe 3.4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,1.028)}}

img.chip.wobble{animation:wobble .6s ease-in-out 1, breathe 3.4s ease-in-out .6s infinite}
@keyframes wobble{20%{transform:rotate(-7deg)}40%{transform:rotate(6deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(2deg)}}
.live{position:relative;display:inline-block;flex:none;transform-origin:50% 100%;animation:breathe 3.4s ease-in-out infinite}
.live img.chip{display:block;width:100%;animation:none}
.live i{position:absolute;display:block;pointer-events:none}
.live .lid{background:#F8CF9B;border-radius:50%;border-bottom:2px solid #5D310E;transform:scaleY(0);transform-origin:50% 0;transition:transform .07s}
.live .lid.l{left:48.6%;top:25.4%;width:12.4%;height:13.8%}
.live .lid.r{left:77.6%;top:26.2%;width:11.4%;height:13.6%}
.live.blink .lid{transform:scaleY(1)}
/* Talking. --o is how open the mouth is (0 shut, 1 wide). The nose and the lip line of the picture are never covered.
   .mouth.s (picture with a shut smile): the mouth drops open BELOW the smile line, which stays as the upper lip.
   .mouth.w (picture with an open smile): the lower lip rises inside the painted mouth and falls back. */
.live{--o:0}
.live.smile{--o:1}
.live .mouth b{position:absolute;display:block;transition:transform .09s ease-out;will-change:transform}
.live .mouth.s b{left:12%;right:12%;top:0;height:100%;background:#481200;border-radius:0 0 50% 50%/0 0 100% 100%;overflow:hidden;transform:translateY(calc((var(--o) - 1)*(100% - var(--z))))}
.live .mouth.s b::before{content:"";position:absolute;left:9%;right:9%;top:0;bottom:12%;background:#892C1E;border-radius:inherit}
.live .mouth.s b::after{content:"";position:absolute;left:25%;right:25%;bottom:11%;height:36%;background:#EC867B;border-radius:50% 50% 46% 46%/70% 70% 30% 30%;transition:transform .09s ease-out;transform:translateY(calc((1 - var(--o))*170%))}
.live .mouth.w b{left:-30%;width:160%;top:0;height:200%;transform-origin:50% 25%;background:radial-gradient(ellipse 47% 47.5% at 50% 0,transparent 97%,var(--sk) 99%);transform:rotate(var(--a)) translateY(calc(var(--o)*35% - 25%))}
.live .mouth.w u{position:absolute;display:block;inset:0}
.live .mouth.w u b{background:radial-gradient(ellipse 47% 47.5% at 50% 0,transparent 89%,#481200 92%,#481200 100%,transparent 101%)}

.body{animation:slidein .35s ease-out}
@keyframes slidein{from{transform:translateX(26px);opacity:0}to{transform:none;opacity:1}}
.opts .opt,.bank .tile,.match .opt,.ffgrid .ff,.card{animation:popup .36s cubic-bezier(.3,1.4,.5,1) backwards}
.opts .opt:nth-child(2),.bank .tile:nth-child(2),.match .col .opt:nth-child(2){animation-delay:.06s}
.opts .opt:nth-child(3),.bank .tile:nth-child(3),.match .col .opt:nth-child(3){animation-delay:.12s}
.opts .opt:nth-child(4),.bank .tile:nth-child(4),.match .col .opt:nth-child(4){animation-delay:.18s}
.bank .tile:nth-child(n+5),.match .col .opt:nth-child(n+5){animation-delay:.24s}
@keyframes popup{from{transform:scale(.85) translateY(8px);opacity:0}to{transform:none;opacity:1}}
.opt.ok,.answer.ok .tile{position:relative;animation:okbounce .5s cubic-bezier(.3,1.6,.5,1) 1}
@keyframes okbounce{30%{transform:scale(1.08)}60%{transform:scale(.97)}100%{transform:scale(1)}}
.opt.ok::after{content:"✨";position:absolute;top:-12px;right:-6px;font-size:22px;animation:sparkle .9s ease-out forwards}
@keyframes sparkle{from{transform:scale(.4) rotate(-20deg);opacity:0}40%{opacity:1}to{transform:scale(1.3) translateY(-10px) rotate(15deg);opacity:0}}
.answer.no .tile{animation:shake .3s}
.progress i{position:relative;overflow:hidden}
.progress i::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-100%);animation:shine 2.6s ease-in-out infinite}
@keyframes shine{60%,100%{transform:translateX(100%)}}
.progress.gold,.progress.orange{animation:glow 1.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 4px rgba(255,196,61,.35)}}
.node.current .ring{animation:nodebob 2.2s ease-in-out infinite}
@keyframes nodebob{50%{transform:translateY(-5px)}}
.btn:active:not(:disabled){transform:translateY(5px) scale(.985)}
.footer.ok,.footer.no{animation:slideup .25s ease-out}
@keyframes slideup{from{transform:translateY(100%)}to{transform:none}}
.peek{position:fixed;right:-90px;bottom:120px;width:90px;z-index:15;pointer-events:none;transition:transform .7s cubic-bezier(.3,1.4,.5,1)}
.peek.in{transform:translateX(-78px) rotate(-12deg)}
/* Progress manager */
.pmc{background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:20px;margin-top:12px;overflow:hidden}
.pmc .hd{display:flex;align-items:center;gap:10px;padding:14px;cursor:pointer}
.pmc .hd .ic{font-size:26px}
.pmc .hd .tx{flex:1}.pmc .hd b{display:block;font-size:18px}
.pmc .hd small{color:var(--muted);font-weight:700}
.pmc .bar{height:8px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:6px}.pmc .bar i{display:block;height:100%;background:var(--good)}
.pmc .chev{transition:transform .2s;color:var(--muted);font-size:20px}
.pmc.open .chev{transform:rotate(90deg)}
.pmc .more{appearance:none;border:0;background:var(--chip);color:var(--ink);width:38px;height:38px;border-radius:12px;font-size:20px;cursor:pointer}
.pmc .body2{display:none;border-top:2px solid var(--line)}
.pmc.open .body2{display:block;animation:popup .25s ease-out}
.pml{display:flex;align-items:center;gap:10px;width:100%;appearance:none;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 14px;font:inherit;color:var(--ink);text-align:left;cursor:pointer}
.pml:last-child{border-bottom:0}
.pml .tx{flex:1;font-weight:800}.pml small{display:block;color:var(--muted);font-weight:700}
.st{font-size:13px;font-weight:800;border-radius:999px;padding:3px 9px;white-space:nowrap}
.st.done{background:var(--good-bg);color:var(--good-ink)}.st.part{background:#FFF1C9;color:#8A5A00}.st.none{background:var(--chip);color:var(--muted)}
.choice{display:grid;gap:8px}
.choice button{appearance:none;text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:12px 14px;font:inherit;font-weight:800;cursor:pointer}
.choice button[aria-pressed="true"]{border-color:var(--primary);background:var(--chip);color:var(--primary)}
/* Celebrations */
.cele{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px 22px 150px;text-align:center}
.cele h2{margin:0;font-family:var(--font-head);font-size:30px}
.cele p{margin:0;font-weight:700;color:var(--muted);font-size:18px}
.cele img.chip{width:170px}
.cele.orange{background:#F59A2E;color:#fff}.cele.orange h2,.cele.orange p{color:#FFF6DC}
.bigflame{font-size:86px;line-height:1;animation:flame 1.2s ease-in-out infinite;transform-origin:50% 90%}
@keyframes flame{0%,100%{transform:scale(1) rotate(-2deg)}50%{transform:scale(1.08,1.12) rotate(2deg)}}
.bignum{font-family:var(--font-head);font-weight:800;font-size:90px;line-height:.9}
.cele.orange .bignum{color:#FFF6DC}
.week span.frz{background:#CFEAFF;color:#2A6FB0}
.week span.next{background:transparent;border:3px dashed rgba(255,255,255,.7)}
.cele:not(.orange) .week span{background:var(--chip);color:var(--muted)}
.cele:not(.orange) .week span.on{background:#F59A2E;color:#fff}
.cele:not(.orange) .week span.today{background:#F59A2E;color:#fff;box-shadow:0 0 0 4px #FFE0B8}
.cele:not(.orange) .week span.next{border-color:#F59A2E;color:#F59A2E}
.calpage{width:120px;border-radius:16px;overflow:hidden;box-shadow:0 6px 0 rgba(0,0,0,.12);background:#fff;animation:popup .5s cubic-bezier(.3,1.5,.5,1)}
.calpage div:first-child{background:#E5533F;height:26px}
.calpage div:last-child{font-family:var(--font-head);font-weight:800;font-size:60px;color:#3A2A1F;padding:6px 0}
.chest{font-size:110px;cursor:pointer;animation:chestwob 1.2s ease-in-out infinite;user-select:none}
@keyframes chestwob{0%,100%{transform:rotate(0)}15%{transform:rotate(-8deg)}30%{transform:rotate(8deg)}45%{transform:rotate(0)}}
.chest.open{animation:chestopen .6s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes chestopen{40%{transform:scale(1.25)}100%{transform:scale(1)}}
.bigicon{font-size:90px;animation:popin .7s cubic-bezier(.3,1.7,.5,1)}
.perfect{position:fixed;inset:0;z-index:60;display:grid;place-items:center;pointer-events:none}
.perfect b{font-family:var(--font-head);font-style:italic;font-weight:800;font-size:64px;color:#FFB020;-webkit-text-stroke:3px #7A3A00;text-shadow:0 6px 0 #7A3A00;animation:stamp 1.6s cubic-bezier(.3,1.6,.5,1) forwards}
.perfect::before{content:"";position:absolute;width:520px;height:520px;background:repeating-conic-gradient(rgba(255,196,61,.55) 0 10deg, transparent 10deg 30deg);border-radius:50%;animation:rays 1.6s ease-out forwards}
@keyframes stamp{0%{transform:scale(3) rotate(-14deg);opacity:0}25%{transform:scale(.9) rotate(-8deg);opacity:1}35%{transform:scale(1.05) rotate(-8deg)}80%{opacity:1}100%{transform:scale(1) rotate(-8deg);opacity:0}}
@keyframes rays{0%{transform:scale(.2) rotate(0);opacity:0}30%{opacity:1}100%{transform:scale(1.2) rotate(90deg);opacity:0}}
/* Streak calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal .h{font-size:12px;font-weight:800;color:var(--muted)}
.cal .d{aspect-ratio:1;display:grid;place-items:center;border-radius:50%;font-weight:800;font-size:15px;color:var(--muted)}
.cal .d.on{background:#F59A2E;color:#fff}
.cal .d.frz{background:#CFEAFF;color:#2A6FB0}
.cal .d.today{box-shadow:0 0 0 3px #F59A2E}
.cal .d.ms{background:#FFF1C9;color:#8A5A00}
.streakhead{display:flex;align-items:center;gap:14px;background:#FFF1DE;border-radius:20px;padding:14px}
.streakhead .n{font-family:var(--font-head);font-weight:800;font-size:44px;color:#E07800;line-height:1}
.frzbox{display:flex;align-items:center;gap:12px;background:#E8F4FF;border-radius:16px;padding:12px;margin-top:12px;color:#20507F;font-weight:700}
.stat.dim{opacity:.55;filter:grayscale(1)}
/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:2px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar .in{display:flex;width:100%;max-width:560px}
.tabbar button{flex:1;appearance:none;border:0;background:none;color:var(--muted);font:inherit;font-size:24px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;border-radius:14px;cursor:pointer;position:relative}
.tabbar button span{font-size:11px;font-weight:800}
.tabbar button[aria-current="true"]{background:var(--chip);color:var(--primary)}
.tabbar .dot{position:absolute;top:4px;right:calc(50% - 18px);width:10px;height:10px;border-radius:50%;background:var(--bad)}
.tabspace{height:96px}
/* Today card: daily goal ring + quests */
.today{margin:10px 16px 0;display:flex;align-items:center;gap:12px;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:20px;padding:10px 12px;cursor:pointer}
.today .tx{flex:1}.today b{display:block}.today small{color:var(--muted);font-weight:700}
.goalring{width:54px;height:54px;flex:none;position:relative}
.goalring svg{width:100%;height:100%;transform:rotate(-90deg)}
.goalring span{position:absolute;inset:0;display:grid;place-items:center;font-size:22px}
.qpill{background:var(--chip);border-radius:999px;padding:6px 12px;font-weight:800;white-space:nowrap}
/* Screens with a header */
.phead2{padding:18px 18px 22px;border-radius:0 0 26px 26px;color:#fff;display:flex;align-items:center;gap:12px}
.phead2 h2{margin:0;font-family:var(--font-head);font-size:28px}.phead2 p{margin:2px 0 0;font-weight:700;opacity:.92}
.phead2 img.chip{width:84px}
.qcard{display:flex;align-items:center;gap:12px;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:18px;padding:14px}
.qcard .ic{font-size:30px}.qcard .tx{flex:1;font-weight:800}
.qbar{height:16px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:6px;position:relative}
.qbar i{display:block;height:100%;background:var(--sun);border-radius:9px}
.qbar em{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:800;color:#5A3A00}
.qcard.done{border-color:var(--good)}.qcard.done .qbar i{background:var(--good)}
.goalpick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.goalpick button{appearance:none;border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);color:var(--ink);border-radius:14px;padding:10px 4px;font:inherit;font-weight:800;cursor:pointer}
.goalpick button small{display:block;color:var(--muted);font-size:12px}
.goalpick button[aria-pressed="true"]{border-color:var(--primary);background:var(--chip);color:var(--primary)}
/* Badges */
.bcard{display:flex;gap:12px;align-items:center;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:18px;padding:12px}
.btile{width:72px;height:80px;flex:none;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:34px;position:relative;overflow:hidden;background:var(--line)}
.btile em{position:absolute;left:0;right:0;bottom:0;font-style:normal;font-size:10px;font-weight:800;color:#fff;text-align:center;padding:2px 0;background:rgba(0,0,0,.25)}
.btile.l0{filter:grayscale(1);opacity:.55}.btile.l1{background:#E9B98F}.btile.l2{background:#C9D3DE}.btile.l3{background:#FFD45C}
.bcard .tx{flex:1}.bcard b{font-size:17px}.bcard small{display:block;color:var(--muted);font-weight:700}
/* Wardrobe accessories, drawn on Миша’s main pose */
.live{container-type:inline-size}
.live .acc{position:absolute;line-height:1;pointer-events:none;filter:drop-shadow(0 2px 0 rgba(0,0,0,.15))}
.live .acc.head{left:68%;top:-7%;transform:translateX(-50%) rotate(-8deg);font-size:31cqw}
.live .acc.neck{left:67.5%;top:51%;transform:translate(-50%,-50%);font-size:15cqw}
.live .acc.hand{left:93%;top:60%;transform:translate(-50%,-50%) rotate(10deg);font-size:24cqw}
.live.hop{animation:hop .55s cubic-bezier(.3,1.6,.5,1) 1}
.greet .live{width:104px}
.wprev{display:flex;justify-content:center;padding:6px 0 0}
.wprev .live{width:190px}
.igrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.item.next{border-color:var(--accent,#D9692B);box-shadow:0 0 0 3px rgba(217,105,43,.18);animation:nextGlow 2.2s ease-in-out infinite}
@keyframes nextGlow{50%{box-shadow:0 0 0 6px rgba(217,105,43,.10)}}
.item.hint .pic{opacity:.38;filter:saturate(.55)}.item.hint b{color:var(--muted)}
.item.mystery{background:var(--line);border-color:var(--line)}
.item.mystery .pic{filter:grayscale(1) brightness(0);opacity:.13}.item.mystery b{font-size:20px;color:var(--muted)}
.pwrap{display:grid;gap:6px;justify-items:center}
.ctog{display:inline-flex;gap:4px;background:var(--line);padding:3px;border-radius:999px}
.ctog button{appearance:none;border:0;background:transparent;font-size:20px;line-height:1;padding:5px 10px;border-radius:999px;cursor:pointer;opacity:.45;filter:grayscale(.6)}
.ctog button[aria-pressed="true"]{background:var(--surface);opacity:1;filter:none;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.cflag{font-size:16px;margin-left:4px}
.dcourse{margin:4px 0 2px}
.emptygal{text-align:center;padding:22px 14px;border:2px dashed var(--line);border-radius:20px;margin-top:12px;display:grid;gap:6px}.emptygal small{color:var(--muted);font-weight:700}
.wscard{margin:12px 16px 0;padding:14px;border-radius:20px;background:linear-gradient(135deg,#FFF4D6,#FFE1EC);border:2px solid #F2B84B;border-bottom-width:5px;box-shadow:0 0 0 0 rgba(242,184,75,.5);animation:wsGlow 2.6s ease-in-out infinite;color:#3B2A1A}
.wscard.ready{border-color:#3CAA5E;background:linear-gradient(135deg,#E5F8E9,#FFF4D6)}
@keyframes wsGlow{50%{box-shadow:0 0 0 7px rgba(242,184,75,.16)}}
.wsh{display:flex;gap:10px;align-items:center}.wsh b{display:block;font-family:var(--font-head);font-size:18px}.wsh small{display:block;color:#7A6450;font-weight:700;font-size:13px}
.wsi{font-size:34px;flex:none}
.wstrack{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:12px 0 8px;text-align:center}
.wstrack div{opacity:.35}.wstrack div.done{opacity:.75}.wstrack div.now{opacity:1;transform:scale(1.08)}
.wstrack span{display:block;font-size:26px}.wstrack small{font-size:11px;font-weight:800;line-height:1.1;display:block}
.wsmsg{background:#fff;border-radius:14px;padding:10px 12px;font-weight:700;font-size:15px;margin:4px 0 10px;color:#3B2A1A}
.wscard .nbar{background:rgba(0,0,0,.08)}
.wslog div{border-top:2px solid var(--line);padding:8px 0}.wslog small{color:var(--muted);font-weight:800}.wslog p{margin:2px 0 0;font-weight:700}
.wsideas{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chipbtn{appearance:none;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 10px;font:inherit;font-weight:700;font-size:14px;cursor:pointer}
.wsorder{border-top:2px solid var(--line);padding:10px 0}.wsorder:first-child{border-top:0}
.wsbtns{display:flex;flex-wrap:wrap;gap:6px}
.wsnew{border-color:#F2B84B}.newpill{background:#E8507A;color:#fff;border-radius:999px;font-size:12px;padding:2px 8px;vertical-align:middle}
.nextcard{margin:10px 16px 0;padding:12px;border-radius:20px;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;display:flex;gap:12px;align-items:center}
.nextcard>img{width:86px;height:86px;object-fit:contain;flex:none}
.nextcard .tx{flex:1;min-width:0}.nextcard small{color:var(--muted);font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.nextcard b{display:block;font-family:var(--font-head);font-size:20px}
.nbar{position:relative;height:20px;border-radius:10px;background:var(--line);overflow:hidden;margin:6px 0 8px}
.nbar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#FFC43D,#FF9A3D);border-radius:10px;transition:width .6s}
.nbar em{position:relative;display:block;text-align:center;font-style:normal;font-weight:800;font-size:12px;line-height:20px}
.nbtns{display:flex;gap:8px}.nbtns .btn{flex:1;padding-left:6px;padding-right:6px}
.party{position:fixed;inset:0;z-index:200;background:radial-gradient(circle at 50% 40%,#3B2A6B,#140C2E);display:grid;place-items:center;animation:pIn .35s ease-out}
.party.out{opacity:0;transition:opacity .3s}
.party canvas{position:absolute;inset:0;width:100%;height:100%}
.party .pin{position:relative;text-align:center;color:#fff;padding:20px}
.party .ptitle{font-family:var(--font-head);font-size:30px;font-weight:800;color:#FFD66B;text-shadow:0 3px 0 rgba(0,0,0,.25);animation:pPop .6s .2s both}
.party .pmisha{width:230px;margin:6px auto 0;display:block;animation:pPop .7s .35s both}
.party h2{font-family:var(--font-head);font-size:28px;margin:4px 0 18px;animation:pPop .6s .6s both}
.party .btn{min-width:220px;animation:pPop .5s 1s both}
@keyframes pIn{from{opacity:0}}
@keyframes pPop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
.item{appearance:none;cursor:pointer;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit}
.item .e{font-size:40px;line-height:1.1}.item b{font-size:13px}.item small{font-size:12px;font-weight:800;color:var(--muted)}
.item.wearing{border-color:var(--good);background:var(--good-bg)}
.item.locked{opacity:.55}
/* Match Madness */
.mmtop{display:flex;align-items:center;gap:10px;padding:10px 14px}
.mmtime{flex:1;height:16px;border-radius:9px;background:var(--line);overflow:hidden}.mmtime i{display:block;height:100%;background:var(--sun);transition:width 1s linear}
.mmgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:8px 16px}
.mmgrid .opt{min-height:62px;justify-content:center}
.mmgrid .opt.gone{visibility:hidden}
/* Family */
.fam{margin:10px 16px 0;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:20px;padding:12px 14px}
.fam .row1{display:flex;align-items:center;gap:10px;font-weight:800}
.fam small{color:var(--muted);font-weight:700}
.fam .avs{display:flex;gap:2px}
.rw{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.rw .e{font-size:30px}.rw .tx{flex:1}.rw small{display:block;color:var(--muted);font-weight:700}
.emo{display:flex;flex-wrap:wrap;gap:6px}.emo button{font-size:26px;appearance:none;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:4px 8px;cursor:pointer}
.emo button[aria-pressed="true"]{border-color:var(--primary);background:var(--chip)}
/* 7c: always-visible way back */
.navtop{position:sticky;top:0;z-index:12;background:var(--bg);padding-top:max(8px, env(safe-area-inset-top,0px));box-shadow:0 2px 0 var(--line)}
.iconbtn.back,.xbtn{width:52px;height:52px;font-size:28px;font-weight:800;color:var(--ink);background:var(--chip);border-radius:16px}
.lessonbar{position:sticky;top:0;z-index:12;background:var(--bg)}
#quit{font-size:28px;width:50px;height:50px;color:var(--ink)}
.sheethead{position:sticky;top:-20px;z-index:3;display:flex;justify-content:flex-end;margin:-20px -20px 0;padding:10px 12px 0;background:var(--surface)}
.xbtn{appearance:none;border:0;cursor:pointer;display:grid;place-items:center}
/* 7b: visible press feedback */
.tapfx{animation:tapfx .25s ease-out}
@keyframes tapfx{0%{filter:brightness(.88);transform:scale(.95)}100%{filter:none;transform:none}}
.btn.done{background:var(--good)!important;color:#fff!important;box-shadow:0 5px 0 var(--good-lip)!important;border-color:transparent!important}
/* 9: pop-up above the circle when there is no room below */
.popcard.up{top:auto;bottom:calc(100% + 10px)}
.popcard.up::before{top:auto;bottom:-8px}
/* 10: statistics */
.gdist{display:flex;height:22px;border-radius:11px;overflow:hidden;margin:8px 0 4px;background:var(--line)}
.gdist i{display:block;height:100%}
.gA{background:#3CAA5E}.gB{background:#8CC152}.gC{background:#F6BB42}.gD{background:#F08A3C}.gF{background:#E5533F}.gN{background:var(--lock)}
.grade{display:inline-grid;place-items:center;min-width:34px;height:34px;border-radius:10px;font-family:var(--font-head);font-weight:800;color:#fff;font-size:18px}
.grade.gN{color:var(--muted);font-size:12px}
.chipsel{display:flex;gap:6px;flex-wrap:wrap}
.chipsel button{appearance:none;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-weight:800;cursor:pointer}

function tapify(ru){
  return ru.split(/(\s+)/).map(tok => {
    if (/^\s+$/.test(tok)) return tok;
    const m = tok.match(/^([«"(]*)(.*?)([.,!?»")]*)$/);
    const core = m[2], key = norm(core);
    return GLOSS[key] ? `${m[1]}<span class="tw" data-w="${esc(core)}" data-g="${esc(GLOSS[key])}">${core}</span>${m[3]}` : tok;
  }).join("");
}

const CUSTOM_ITEMS = [];

const wsItem = o => o && CUSTOM_ITEMS.find(c => c.order===o.id);
function wsPick(kind, s = S){
  const pool = WS_MSGS[kind]; s.wsSeen = s.wsSeen || {}; let seen = s.wsSeen[kind] || [];
  if (seen.length >= pool.length) seen = [];
  const free = pool.map((_, i) => i).filter(i => !seen.includes(i)), i = free[Math.floor(Math.random()*free.length)];
  s.wsSeen[kind] = seen.concat(i); return pool[i];
}
/* the order is “ready” on the day the grown-up switched it, but never before day 3 */
const wsReadyD = o => o.readyDay ? Math.max(3, daysBetween(o.day, o.readyDay)) : Infinity;
function wsSync(s = S){
  const o = s.order; if (!o) return;
  o.log = o.log || []; const dNow = daysBetween(o.day, todayKey());
  for (let d = (o.lastD ?? -1) + 1; d <= dNow; d++){
    if (o.log.some(e => e.k==="ready")) break;
    if (d===0) o.log.push({d, k:"studio", t:wsPick("studio", s)});
    else if (d===1) o.log.push({d, k:"workshop", t:wsPick("workshop", s)});
    else if (d===2){ o.log.push({d, k:"warehouse", t:wsPick("warehouse", s)}); o.log.push({d, k:"road", t:wsPick("road", s)}); }
    else if (d >= wsReadyD(o)) o.log.push({d, k:"ready", t:"Your order has arrived at Ми́ша’s house! Tap “Pick it up!”"});
    else o.log.push({d, k:"delay", t:wsPick("delay", s)});
    o.lastD = d;
  }
  /* switched to ready later on a day that already had its news */
  if (!o.log.some(e => e.k==="ready") && dNow >= wsReadyD(o)) o.log.push({d:dNow, k:"ready", t:"Your order has arrived at Ми́ша’s house! Tap “Pick it up!”"});
  if (s===S && !o.notified) wsNotify(o);
}
const wsReady = o => !!(o && o.log && o.log.some(e => e.k==="ready"));
const wsStage = o => wsReady(o) ? 3 : Math.min(2, daysBetween(o.day, todayKey()));

}

function wsDashWire(editKid){

let tryOn = null;   /* the next item, tried on but not bought */
function wardrobeScreen(){
  ensureFields(S); S.owned = S.owned || []; S.wear = migrateWear(S.wear); if (P.tryAll) P.tryWear = migrateWear(P.tryWear); save();
  const wearing = currentWear(), has = id => P.tryAll || S.owned.includes(id);
  const setWear = id => { if (P.tryAll){ P.tryWear = id; saveP(); } else { S.wear = id; save(); } };
  const shop = SHOP_LINE.map(id => ITEMS.find(i => i.id===id)).filter(Boolean);
  const left = shop.filter(it => !has(it.id)), next = left[0], hint = left[1];
  const prizes = ITEMS.filter(i => i.badge), mine = CUSTOM_ITEMS.filter(c => S.owned.includes(c.id));
  if (tryOn && (!next || tryOn !== next.id)) tryOn = null;
  const shown = tryOn || wearing;
  const pct = next ? Math.min(100, Math.round(100*S.stars/shopPrice(next.id))) : 100;
  const card = it => {
    const st = wearing===it.id ? "wearing" : has(it.id) ? "owned" : it===next ? "next" : it===hint ? "hint" : "mystery";
    const label = st==="wearing" ? "✓ Wearing" : st==="owned" ? "Tap to wear" : st==="next" ? `⭐ ${shopPrice(it.id)}` : st==="hint" ? "Coming next" : `⭐ ${shopPrice(it.id)}`;
    return `<button class="item ${st}" data-item="${it.id}" data-st="${st}"><img class="pic" src="${DRESS.wave[it.id]}" alt="" loading="lazy"><b>${st==="mystery" ? "?" : esc(it.name)}</b><small>${label}</small></button>`;
  };

    return `<button class="item ${st}" data-item="${it.id}" data-st="${st==="mystery" ? "prize" : st}"><img class="pic" src="${DRESS.wave[it.id]}" alt="" loading="lazy"><b>${st==="mystery" ? "?" : esc(it.name)}</b><small>${st==="wearing" ? "✓ Wearing" : st==="owned" ? "Tap to wear" : "🏅 Win a badge"}</small></button>`; };
  app.innerHTML = `<div class="phead2" style="background:#B86A2E"><div><h2>${MN()}’s wardrobe</h2><p>⭐ ${S.stars} stars · one item at a time</p></div></div>
    ${P.tryAll ? `<div class="trybar">🔓 Try-everything mode (grown-up): try anything on. Nothing is bought or saved for the children.</div>` : ""}
    ${P.tryAll ? "" : wsCardHTML()}
    <div class="wprev">${liveMisha("", "wave", shown || null)}</div>
    ${tryOn ? `<p class="note" style="text-align:center;margin:0">Trying on: ${esc(next.name)}</p>` : wearing ? `<div style="text-align:center"><button class="btn small ghost" id="takeOff">Take it off</button></div>` : ""}
    ${next && !P.tryAll ? `<div class="nextcard">
      <img src="${DRESS.wave[next.id]}" alt="">
      <div class="tx"><small>Next for ${MN()}</small><b>${esc(next.name)}</b>
        <div class="nbar"><i style="width:${pct}%"></i><em>⭐ ${Math.min(S.stars, shopPrice(next.id))} / ${shopPrice(next.id)}</em></div>
        <div class="nbtns"><button class="btn small ghost" id="tryBtn">${tryOn ? "Take off" : "👀 Try on"}</button><button class="btn small" id="buyBtn" ${S.stars >= shopPrice(next.id) ? "" : "disabled"}>${S.stars >= shopPrice(next.id) ? "Buy it!" : `${shopPrice(next.id) - S.stars} ⭐ to go`}</button></div>
      </div></div>` : !next && !P.tryAll && shop.length ? `<p class="note" style="text-align:center">${MN()} has every item in the shop. New ones are coming!</p>` : ""}
    <div style="padding:6px 16px 16px">
      ${shop.length ? `<h3 style="font-family:var(--font-head);margin:12px 0 8px">Shop <small style="color:var(--muted);font-size:14px">· ${shop.length - left.length} of ${shop.length}</small></h3>
      <div class="igrid">${shop.map(card).join("")}</div>` : `<div class="emptygal"><div style="font-size:44px">🖼️</div><b>Misha’s ${LN()} gallery is coming soon!</b><small>New items are being made for this course. Keep collecting stars: they’ll be waiting for you.</small></div>`}
      ${mine.length ? `<h3 style="font-family:var(--font-head);margin:18px 0 8px">🧵 Made for you</h3><div class="igrid">${mine.map(it => `<button class="item ${wearing===it.id ? "wearing" : "owned"}" data-item="${it.id}" data-st="${wearing===it.id ? "wearing" : "owned"}"><img class="pic" src="${DRESS.wave[it.id]}" alt="" loading="lazy"><b>${esc(it.name)}</b><small>${wearing===it.id ? "✓ Wearing" : "Tap to wear"}</small></button>`).join("")}</div>` : ""}
      ${prizes.length ? `<h3 style="font-family:var(--font-head);margin:18px 0 8px">Badge prizes <small style="color:var(--muted);font-size:14px">· ${prizes.filter(i => has(i.id)).length} of ${prizes.length}</small></h3>

      <p class="note" style="margin-top:12px">Items open one at a time. Badge prizes are a surprise: win a badge to find out what they are!</p>` : ""}
      ${P.tryAll ? `<div style="margin-top:12px"><button class="btn ghost" id="galBtn">🎬 See all 30 results scenes</button></div>` : ""}</div>${navHTML("misha")}`;
  wireNav();
  const tk = $("#takeOff"); if (tk) tk.onclick = () => { setWear(null); sfx.pop(); wardrobeScreen(); };
  const gb = $("#galBtn"); if (gb) gb.onclick = sceneGallery;
  const tb = $("#tryBtn"); if (tb) tb.onclick = () => { tryOn = tryOn ? null : next.id; sfx.pop(); if (tryOn) sfx.giggle(); wardrobeScreen(); window.scrollTo({top:0, behavior:"smooth"}); };
  const bb = $("#buyBtn"); if (bb) bb.onclick = () => buyItem(next);
  if (!P.tryAll) wsWire();
  app.querySelectorAll("[data-item]").forEach(b => b.onclick = () => {
    const it = ITEMS.find(i => i.id===b.dataset.item) || CUSTOM_ITEMS.find(i => i.id===b.dataset.item), st = b.dataset.st;
    if (st==="wearing"){ setWear(null); tryOn = null; return wardrobeScreen(); }
    if (st==="owned"){ tryOn = null; setWear(it.id); sfx.pop(); sfx.giggle(); return wardrobeScreen(); }
    if (st==="next"){ tryOn = it.id; sfx.pop(); sfx.giggle(); wardrobeScreen(); window.scrollTo({top:0, behavior:"smooth"}); return; }
    if (st==="hint"){ toast(`Coming after the ${next.name}. Keep collecting stars!`); return; }
    if (st==="prize"){ toast("A badge prize! Get a badge to level 3 to find out what it is."); return; }
    toast("A surprise for later. Items open one at a time!");
  });
}
function buyItem(it){
  const price = shopPrice(it.id);
  if (S.stars < price){ toast(`You need ${price - S.stars} more stars. Keep learning!`); return; }
  S.stars -= price; S.owned = (S.owned||[]).concat(it.id); S.wear = it.id; S.shownStars = S.stars; tryOn = null; save();
  buyParty(it);
}
/* ---------- 🎆 The big moment: a new item for Миша ---------- */
function buyParty(it, preview){
  const ov = document.createElement("div"); ov.className = "party";
  ov.innerHTML = `<canvas></canvas><div class="pin"><div class="ptitle">New for ${MN()}!</div>${liveMisha("pmisha", "wave", it.id)}<h2>${esc(it.name)}</h2><button class="btn" id="pDone">Wear it! 🎉</button></div>`;
  document.body.appendChild(ov);
  const cv = ov.querySelector("canvas"), cx = cv.getContext("2d"), dpr = Math.min(2, devicePixelRatio||1);
  const fit = () => { cv.width = innerWidth*dpr; cv.height = innerHeight*dpr; cx.setTransform(dpr,0,0,dpr,0,0); }; fit();
  const cols = ["#FFC43D","#FF7A45","#E8507A","#7FD3FF","#9BE36D","#FFFFFF","#C59BFF"], parts = [], stars = [];
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const burst = () => { const x = innerWidth*(.15 + Math.random()*.7), y = innerHeight*(.12 + Math.random()*.38), c = cols[Math.floor(Math.random()*cols.length)];
    for (let k = 0; k < 46; k++){ const a = Math.random()*Math.PI*2, v = 2 + Math.random()*4.5; parts.push({x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v, life:1, c}); }
    try { sfx.pop(); } catch(_){} };
  const star = () => stars.push({x:Math.random()*innerWidth, y:innerHeight + 30, vy:-(3 + Math.random()*4), vx:(Math.random()-.5)*1.5, r:12 + Math.random()*16, rot:Math.random()*6, vr:(Math.random()-.5)*.2});
  let t = 0, raf = 0, alive = true;
  const draw5 = (x, y, r, rot) => { cx.save(); cx.translate(x, y); cx.rotate(rot); cx.beginPath();
    for (let i = 0; i < 10; i++){ const rr = i%2 ? r*.45 : r, a = i*Math.PI/5 - Math.PI/2; cx.lineTo(Math.cos(a)*rr, Math.sin(a)*rr); }
    cx.closePath(); cx.fillStyle = "#FFC43D"; cx.fill(); cx.lineWidth = 2; cx.strokeStyle = "#E89A00"; cx.stroke(); cx.restore(); };
  const loop = () => {
    if (!alive) return; t++;
    cx.clearRect(0, 0, innerWidth, innerHeight);
    if (t % 38 === 1 && t < 420) burst();
    if (t < 160 && t % 3 === 0) star(); else if (t % 14 === 0) star();
    for (let i = parts.length-1; i >= 0; i--){ const q = parts[i]; q.x += q.vx; q.y += q.vy; q.vy += .05; q.vx *= .985; q.life -= .012;
      if (q.life <= 0){ parts.splice(i,1); continue; } cx.globalAlpha = q.life; cx.fillStyle = q.c; cx.beginPath(); cx.arc(q.x, q.y, 2.6, 0, 7); cx.fill(); }
    cx.globalAlpha = 1;
    for (let i = stars.length-1; i >= 0; i--){ const q = stars[i]; q.y += q.vy; q.x += q.vx; q.rot += q.vr; if (q.y < -40){ stars.splice(i,1); continue; } draw5(q.x, q.y, q.r, q.rot); }
    raf = requestAnimationFrame(loop);
  };
  if (!still){ burst(); loop(); }
  try { sfx.chestOpen(); setTimeout(() => sfx.giggle(), 700); setTimeout(() => sfx.goal && sfx.goal(), 1200); } catch(_){}
  buzz([30,40,30,40,80]);
  if (preview) ov.querySelector("#pDone").textContent = "Close preview";
  const close = () => { alive = false; cancelAnimationFrame(raf); ov.classList.add("out"); setTimeout(() => ov.remove(), 300); if (!preview) wardrobeScreen(); };
  ov.querySelector("#pDone").onclick = close;
}

const courseScenes = () => Object.keys(SCENES).filter(id => (CC==="es") === id.startsWith("es_"));
function pickScene(c){
  let set;
  if (c.comeback) set = "comeback";
  else if (c.unitDone && !c.isP) set = "unit";
  else if (c.flawless) set = "flawless";
  else if (c.voice >= 85) set = "voice";
  else if (c.secs < 150 && c.acc >= 80) set = "fast";
  else if (c.combo >= 10) set = "combo";
  else if (c.levelDone && !c.isP) set = "level";
  else if (c.isP) set = "practice";
  else set = c.acc >= 85 ? "great" : c.acc >= 70 ? "good" : "tough";
  const recent = S.recentScenes || [];
  const SETS = sceneSets(), pool = SETS[set].filter(id => !recent.includes(id));
  const id = (pool.length ? pool : SETS[set])[Math.floor(Math.random()*(pool.length || SETS[set].length))];
  S.recentScenes = recent.concat(id).slice(-10);
  /* each scene has 10 sayings; a child hears all of them before any comes back */
  const lines = SCENES[id].t; S.sceneSeen = S.sceneSeen || {};
  let seen = (S.sceneSeen[id] || []).filter(i => i < lines.length); if (seen.length >= lines.length) seen = [];
  const free = lines.map((_, i) => i).filter(i => !seen.includes(i)), li = free[Math.floor(Math.random()*free.length)];
  S.sceneSeen[id] = seen.concat(li);
  return {id, title: deRu(lines[li])};
}

/* ---------- Match Madness: 60 seconds, beat your own best ---------- */
function matchMadness(){
  let pool = learnedWords().map(w => ({id:"w:"+w.id, l:w.ru, r:w.en}));
  if (pool.length < 5) pool = LETTERS.filter(l => l.g < Math.max(1, S.alpha||0)).map(l => ({id:"l:"+l.u, l:`${l.u} ${l.l}`, r:l.snd}));
  if (pool.length < 5){ toast("Learn a few more words first, then come back!"); return; }
  let score = 0, left = 60, sel = {l:null, r:null}, timer = null, over = false;
  const best = S.mmBest || 0;
  const pickNew = (exclude) => { const c = pool.filter(p => !exclude.includes(p.id)); return c[Math.floor(Math.random()*c.length)]; };
  let rows = sample(pool, 5), leftCol = shuffle(rows.slice()), rightCol = shuffle(rows.slice());
  const draw = () => {
    app.innerHTML = `<div class="mmtop"><button class="iconbtn" id="quitMM" aria-label="Stop">✕</button><div class="mmtime"><i id="mmBar" style="width:${100*left/60}%"></i></div><b id="mmSc" style="font-family:var(--font-head);font-size:20px">${score}</b></div>
      <p class="prompt" style="padding:0 16px;margin:4px 0">⏲️ Match Madness</p><p class="sub" style="padding:0 16px;margin:0">Match as many pairs as you can! Best: ${best}</p>
      <div class="mmgrid">${[0,1,2,3,4].map(i => `<button class="opt" data-side="l" data-i="${i}"><span class="ru" style="font-size:20px">${leftCol[i].l}</span></button><button class="opt" data-side="r" data-i="${i}">${esc(rightCol[i].r)}</button>`).join("")}</div>`;
    $("#quitMM").onclick = () => { clearInterval(timer); practiceScreen(); };
    app.querySelectorAll(".mmgrid .opt").forEach(b => b.onclick = () => {
      if (over) return; const side = b.dataset.side;
      app.querySelectorAll(`.mmgrid [data-side="${side}"]`).forEach(x => x.setAttribute("aria-pressed","false"));
      b.setAttribute("aria-pressed","true"); sel[side] = +b.dataset.i;
      if (sel.l != null && sel.r != null){
        const a = leftCol[sel.l], c = rightCol[sel.r], li = sel.l, ri = sel.r; sel = {l:null, r:null};
        if (a.id === c.id){
          score++; sfx.place(); buzz(15);
          const lb = app.querySelector(`[data-side="l"][data-i="${li}"]`), rb = app.querySelector(`[data-side="r"][data-i="${ri}"]`);
          [lb, rb].forEach(x => { if (x) x.classList.add("ok"); });
          setTimeout(() => { const nw = pickNew(leftCol.map(x => x.id)); leftCol[li] = nw; rightCol[ri] = nw; if (!over) draw(); }, 280);
          if ($("#mmSc")) $("#mmSc").textContent = score;
        } else {
          sfx.bad(); buzz([30,20,30]);
          app.querySelectorAll(`[data-i="${li}"][data-side="l"],[data-i="${ri}"][data-side="r"]`).forEach(x => { x.classList.add("no"); setTimeout(() => { x.classList.remove("no"); x.setAttribute("aria-pressed","false"); }, 350); });
        }
      }
    });
  };
  draw();
  timer = setInterval(() => {
    if (document.hidden) return;
    left--; const bar = $("#mmBar"); if (bar) bar.style.width = (100*left/60) + "%";
    if (left <= 10 && left > 0) sfx.tick();
    if (left <= 0){
      clearInterval(timer); over = true;
      const earned = Math.max(1, Math.floor(score/4)), record = score > best;
      S.mmBest = Math.max(best, score); addStars(earned); bumpCnt("mm"); questProgress("mm", 1);
      S.stats = S.stats || {lessons:0, practice:0, answers:0, correct:0};
      save();
      celeShell("", `${chip(record ? "cheer-jump" : "thumbs-up")}<h2>${record ? "New record!" : "Time’s up!"}</h2><p>You matched <b>${score}</b> pairs. Best: ${S.mmBest}</p><p>+${earned} ⭐</p>`, "Continue", () => runChain([badgeCheckStep()]));
      sfx.buzzer(); if (record){ setTimeout(() => { sfx.levelUp(); sfx.giggle(); }, 600); confetti(50); buzz([30,40,30,40]); }
    }
  }, 1000);
}

/* ---------- Family goal (weekly, shared) and family rewards ---------- */
const weekStart = () => { const n = new Date(), dow = (n.getDay()+6)%7; return addDays(todayKey(), -dow); };
function weekStars(s){ const ws = weekStart(), log = s.starLog || {}; return Object.keys(log).filter(k => k >= ws).reduce((a,k) => a + log[k], 0); }
function familyStatus(){
  P.family = P.family || {target:60};
  const per = P.profiles.map(p => ({p, n: weekStars(stateOf(p.id, "ru")) + weekStars(stateOf(p.id, "es"))}));
  return {target:P.family.target, total:per.reduce((a,x) => a + x.n, 0), per};
}
function rewardsFor(pid){ return (P.rewards||[]).filter(r => r.who==="all" || r.who===pid); }
function rewardProgress(r, pid){
  if (r.kind==="stars") return {have: (stateOf(pid, "ru").earned||0) + (stateOf(pid, "es").earned||0), need: r.value};
  const c = r.kind.startsWith("es:") ? "es" : "ru", k = r.kind.replace(/^es:/, ""), s = stateOf(pid, c);
  if (k==="letters") return {have: Math.min(s.alpha||0, 6), need: 6};
  const u = +(k.slice(4)) || 1, d = s[doneKey(u)] || [0,0,0,0,0];
  return {have: d.reduce((a,v,i) => a + Math.min(v, LEVELS[i].lessons), 0), need: LEVELS.reduce((a,l) => a + l.lessons, 0)};
}
function rewardLabel(r){ if (r.kind==="stars") return `${r.value} ⭐`; const es = r.kind.startsWith("es:"), k = r.kind.replace(/^es:/, ""), f = es ? "🇪🇸" : "🇷🇺";
  return k==="letters" ? (es ? `${f} Finish the sounds` : `${f} Finish the letters`) : `${f} Finish Unit ${+(k.slice(4)) || 1}`; }
function nextReward(){
  const list = rewardsFor(P.current).filter(r => !(r.earned||{})[P.current]);
  return list.map(r => ({r, pr: rewardProgress(r, P.current)})).sort((a,b) => (b.pr.have/b.pr.need) - (a.pr.have/a.pr.need))[0] || null;
}
function familyStep(beforeTotal){
  return done => {
    const fs = familyStatus(), wk = weekStart();
    if (beforeTotal < fs.target && fs.total >= fs.target && P.famDone !== wk){
      P.famDone = wk; saveP();
      celeShell("", `${chip("cheer-eyes-closed")}<div style="font-size:70px">👪</div><h2>Family goal reached!</h2><p>Together you earned ${fs.total} ⭐ this week. Great teamwork!</p>`, "Continue", done);
      sfx.reward(); confetti(70); buzz([30,40,30,40,60]);
    } else done();
  };
}
function rewardStep(){
  return done => {
    const won = rewardsFor(P.current).filter(r => !(r.earned||{})[P.current] && (pr => pr.have >= pr.need)(rewardProgress(r, P.current)));
    const show = () => {
      const r = won.shift(); if (!r){ saveP(); return done(); }
      r.earned = r.earned || {}; r.earned[P.current] = todayKey();
      celeShell("", `${chip("love-heart-eyes")}<div style="font-size:84px;animation:popin .7s cubic-bezier(.3,1.7,.5,1)">${r.emoji}</div><h2>You earned a family reward!</h2><p style="font-size:22px;color:var(--ink)"><b>${esc(r.title)}</b></p><p>Show this screen to a grown-up! 🎉</p>`, "Yay!", show);
      sfx.reward(); sfx.giggle(); confetti(80); buzz([40,40,40,40,80]);
    };
    show();
  };

  const opts = shuffle([pick, ...sample(BLANKABLE.filter(b => norm(b)!==norm(pick) && seen.includes(norm(b))), 2)]);
  return {type:"blank", s, word:pick, options:opts};
}
function speakEx(text, en, mode="repeat", extra={}){ return {type:"speak", text, en, mode, ...extra}; }
function heardEx(s, pool){ return {type:"heard", s, options:shuffle([s, ...sample(pool.filter(x=>x!==s), 2)])}; }

function lettersOf(w){ return [...plain(w).toLowerCase()]; }
function readableWords(K){
  if (CC==="es") return K;   /* Spanish uses familiar letters: every word is readable */
  const set = new Set(K.map(l => l.l));
  return K.filter(l => lettersOf(l.word).every(ch => set.has(ch)));
}
/* letters that make the same sound (ll and y, b and v, z and soft c, qu and hard c) never appear in the same question */
const SOUND_MATES = [["LL","Y"],["B","V"],["Z","C"],["QU","C"]];
const mates = (a, b) => a!==b && (a.snd===b.snd || SOUND_MATES.some(m => m.includes(a.u) && m.includes(b.u)));
const hasMate = l => LETTERS.some(x => mates(l, x));
/* the answer plus n wrong choices, no two of which share a sound */
function letterOpts(l, K, n){ const out = [l]; shuffle(K.filter(x => x!==l)).forEach(x => { if (out.length <= n && !out.some(o => mates(o, x))) out.push(x); }); return shuffle(out); }
function soundQ(l, K){ return {type:"lsound", l, options:letterOpts(l, K, 2)}; }
function pickL(l, K){ return {type:"lpick", l, options:letterOpts(l, K, 3)}; }
function hearL(l, K){ return {type:"lhear", l, options:letterOpts(l, K, 2)}; }
function readEx(l, K){
  const others = sample(LETTERS.filter(x => x!==l), 2);
  return {type:"lread", l, options:shuffle([l, ...others]).map(x => ({w:x.word, en:x.wen, pic:x.pic, ref:x}))};
}
function lmatch(list){
  const keep = []; list.forEach(l => { if (!keep.some(k => mates(k, l))) keep.push(l); });
  if (keep.length < list.length) LETTERS.forEach(l => { if (keep.length < list.length && !keep.includes(l) && !keep.some(k => mates(k, l))) keep.push(l); });
  return {type:"match", words:keep.map(l => ({id:"L"+l.u, ru:LP(l), en:l.snd, say:l.name}))};
}
/* say the letter's sound or its name out loud (silent letters practise the name only) */
function sayLEx(l, lt){ return {type:"speak", mode:"repeat", text: lt==="name" ? l.name : (l.st || l.ss || l.name), en:"", l, lt}; }
function sayLetters(g){
  /* sound practice skips silent letters and accent marks (their only example is a whole word) */
  const snd = g.filter(l => !l.pair && (l.st || l.ss) !== l.word), nm = g.filter(l => l.name !== (l.ss || l.name)), out = [];
  const a = snd.length ? sample(snd, Math.min(2, snd.length)) : [];   /* none left (accent-mark lesson): names only */
  a.forEach(l => out.push(sayLEx(l, "sound")));
  const pool = (nm.length ? nm : g).filter(l => !a.includes(l)), b = sample(pool.length >= 2 ? pool : (nm.length ? nm : g), 2);
  b.forEach(l => out.push(sayLEx(l, "name")));

}
function buildAlpha(n){
  const ex = [];
  if (n < 5){
    const g = LETTERS.filter(l => l.g===n), K = LETTERS.filter(l => l.g<=n);
    if (n===1 && CC==="ru") ex.push({type:"ltip"});
    g.forEach((l,i) => { ex.push({type:"lintro", l}); ex.push(i%2 ? pickL(l, K) : soundQ(l, K)); });
    sample(g, 2).forEach(l => ex.push(hearL(l, K)));
    const mix = g.length >= 5 ? sample(g, 5) : g.concat(sample(K.filter(l => l.g<n), 5-g.length));
    ex.push(lmatch(mix));
    const tr = g.filter(l => l.u!=="Ь" && l.u!=="Ъ" && l.u.length===1);
    sample(tr, 1).forEach(l => ex.push({type:"ltrace", l}));
    ex.push(...sayLetters(g));
  } else {
    const A = LETTERS;
    sample(A, 4).forEach(l => ex.push(soundQ(l, A)));
    sample(A, 3).forEach(l => ex.push(pickL(l, A)));
    sample(A, 2).forEach(l => ex.push(hearL(l, A)));
    ex.push(...sayLetters(A));
    ex.push(lmatch(sample(A, 5)));
    sample(A.filter(l => l.u!=="Ь" && l.u!=="Ъ" && l.u.length===1), 1).forEach(l => ex.push({type:"ltrace", l}));
    return shuffle(ex).map(e => ({...e, alpha:true}));
  }
  return ex.map(e => ({...e, alpha:true}));
}
function hl(word, l){
  if (l.l.length > 1){ const i = word.toLowerCase().indexOf(l.l); return i < 0 ? word : word.slice(0, i) + `<b style="color:var(--primary)">${word.slice(i, i + l.l.length)}</b>` + word.slice(i + l.l.length); }
  return word.replace(/([^\u0301])(\u0301?)/g, (m, c, s) => c.toLowerCase()===l.l ? `<b style="color:var(--primary)">${c}${s}</b>` : c + s);
}

function buildLesson(level, n){
  const all = WORDS, qa = UNITS[CU].qa || [];
  const ans = x => speakEx(x.a, "", "answer", {q:x.q, pic:x.pic, hint:x.hint||""});
  if (level===0){
    /* New words: meet it, say it, recognise it; then say some from the picture alone */
    const group = GROUPS[n].map(W), pool = known(n), ex = [];
    group.forEach(w => { ex.push({type:"intro", word:w}); ex.push(speakEx(w.ru, w.en, "repeat")); ex.push(pickPicEx(w, pool)); });
    sample(group, 2).forEach(w => ex.push(speakEx(w.ru, w.en, "picture", {pic:w.pic})));
    sample(pool, 2).forEach(w => ex.push(meaningEx(w, pool)));
    ex.push(matchEx(pool));
    return ex;
  }
  if (level===1){
    /* Sentences: build it with tiles, then say it */
    const pool = sentencePool(n), pairs = [];
    sample(pool, 4).forEach(s => pairs.push([tilesRuEx(s, pool), speakEx(s.ru, s.en, "read", {after:true})]));
    sample(pool, 2).forEach(s => pairs.push([tilesEnEx(s, pool)]));
    sample(pool, 1).forEach(s => pairs.push([blankEx(s, pool)]));
    return shuffle(pairs).flat().concat([matchEx(n===0 ? known(1) : all)]);
  }
  if (level===2){
    /* Speak: all speaking, from easy (repeat) to hard (answer from memory) */
    const ex = [];
    if (n===0){
      const words = known(2), sents = sentencePool(0);
      sample(words, 3).forEach(w => ex.push(speakEx(w.ru, w.en, "repeat")));
      sample(words, 2).forEach(w => ex.push(speakEx(w.ru, w.en, "picture", {pic:w.pic})));
      sample(sents, 2).forEach(s => ex.push(speakEx(s.ru, s.en, "read")));
      sample(sents, 2).forEach(s => ex.push(speakEx(s.ru, s.en, "recall")));
      sample(qa, 2).forEach(x => ex.push(ans(x)));
    } else {
      sample(SENTENCES, 3).forEach(s => ex.push(speakEx(s.ru, s.en, "repeat")));
      sample(SENTENCES, 3).forEach(s => ex.push(speakEx(s.ru, s.en, "read")));
      sample(SENTENCES, 3).forEach(s => ex.push(speakEx(s.ru, s.en, "recall")));
      sample(qa, 3).forEach(x => ex.push(ans(x)));
    }
    return ex;
  }
  if (level===3){
    return STORY.map((st, i) => st.q ? {type:"storyQ", step:i, ...st} : {type:"storyLine", step:i, ...st});
  }
  const ex = [];
  sample(SENTENCES, 2).forEach(s => ex.push(tilesRuEx(s, SENTENCES)));
  sample(SENTENCES, 2).forEach(s => ex.push(tilesEnEx(s, SENTENCES)));
  sample(SENTENCES, 2).forEach(s => ex.push(blankEx(s)));
  sample(SENTENCES, 2).forEach(s => ex.push(speakEx(s.ru, s.en, "recall")));
  sample(all, 1).forEach(w => ex.push(speakEx(w.ru, w.en, "picture", {pic:w.pic})));
  sample(SENTENCES, 1).forEach(s => ex.push(speakEx(s.ru, s.en, "read")));
  sample(qa, 1).forEach(x => ex.push(ans(x)));
  ex.push(matchEx(all));
  return shuffle(ex).map(e => ({...e, review:true}));
}

/* segmented progress ring: one segment per lesson, filled segments in the bright unit colour */
function segRing(frac){
  const n = 12, k = frac > 0 ? Math.max(1, Math.floor(frac*n + 1e-6)) : 0;
  const r = 49.5, c = 53, gap = 13, span = 360/n;
  let out = "";
  for (let i = 0; i < n; i++){
    const a0 = (-90 + i*span + gap/2) * Math.PI/180, a1 = (-90 + (i+1)*span - gap/2) * Math.PI/180;
    const x0 = c + r*Math.cos(a0), y0 = c + r*Math.sin(a0), x1 = c + r*Math.cos(a1), y1 = c + r*Math.sin(a1);
    const large = (span - gap) > 180 ? 1 : 0;
    const d = `M ${x0.toFixed(2)} ${y0.toFixed(2)} A ${r} ${r} 0 ${large} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
    out += `<path d="${d}" fill="none" stroke-width="4.5" stroke-linecap="round" stroke="${i < k ? "var(--uc)" : "var(--ucf)"}"/>`;
  }
  return `<svg class="segring" viewBox="0 0 106 106" aria-hidden="true">${out}</svg>`;
}

        return `<div class="${cls}" style="transform:translateX(${zig[i]}px)">
          <div class="ring">${!lock && !done ? segRing((Math.min(d[i], lv.lessons) + resumeFrac(`u${u}:${i}:${d[i]}`)) / lv.lessons) : ""}<button data-unit="${u}" data-level="${i}" aria-label="Unit ${u}, ${esc(lv.title)}, ${d[i]} of ${lv.lessons} lessons done${lock?", locked":""}">${lock?"🔒":lv.icon}</button></div>

let spotObs = null;
function pathSpot(wasHome, keepY){
  const cur = app.querySelector(".node.current") || app.querySelector(".node:not(.locked):not(.done)") || [...app.querySelectorAll(".node.done")].pop();
  if (wasHome) window.scrollTo(0, keepY);
  else if (cur) requestAnimationFrame(() => { try { cur.scrollIntoView({block:"center"}); } catch(_){} });
  const top = $("#toTop");
  if (top){
    const showTop = () => { if (!top.isConnected){ removeEventListener("scroll", showTop); return; } top.hidden = window.scrollY < innerHeight * 1.2; };
    addEventListener("scroll", showTop, {passive:true}); showTop();
    top.onclick = () => { sfx.tap(); document.querySelectorAll(".popcard").forEach(p => { p.parentElement.classList.remove("open"); p.remove(); }); document.body.classList.remove("popopen"); try { window.scrollTo({top:0, behavior:"smooth"}); } catch(_){ window.scrollTo(0, 0); } };
  }
  const btn = $("#mySpot"); if (!btn || !cur) return;
  if (spotObs) spotObs.disconnect();
  spotObs = new IntersectionObserver(es => es.forEach(e => {
    if (!btn.isConnected){ spotObs.disconnect(); return; }
    btn.hidden = e.isIntersecting; btn.textContent = e.boundingClientRect.top < 0 ? "⬆ My spot" : "⬇ My spot";
  }), {rootMargin:"-60px 0px -110px 0px"});
  spotObs.observe(cur);
  btn.onclick = () => { sfx.tap(); try { cur.scrollIntoView({block:"center", behavior:"smooth"}); } catch(_){ cur.scrollIntoView(); } };
}

/* ---------- Memory engine: Duolingo’s Half-Life Regression (Settles & Meeder, 2016) ----------
   Chance of remembering: p = 2^(−Δ/h), Δ = days since last practice, h = half-life in days.
   Half-life: h = 2^(θ·x), x = [1, √(1+times right), √(1+times wrong)].
   θ starts from sensible defaults and is nudged after every answer, so it adapts to this learner. */
const HLR0 = {b:-1.83, r:2.0, w:-1.0};
const theta = () => S.hlr || HLR0;
function halfLife(it){
  const th = theta(), e = th.b + th.r*Math.sqrt(1+it.r) + th.w*Math.sqrt(1+it.w);
  return Math.min(274, Math.max(1/96, Math.pow(2, e)));
}
function recall(it, now=Date.now()){ return Math.pow(2, -((now - it.t)/864e5) / halfLife(it)); }
function memSeen(key){ S.mem = S.mem || {}; if (key && !S.mem[key]) S.mem[key] = {r:0, w:0, t:Date.now()}; }
function memUpdate(key, ok){
  if (!key) return;
  S.mem = S.mem || {}; const now = Date.now(), old = S.mem[key], it = old ? {...old} : {r:0, w:0, t:now};
  if (old){
    const d = (now - old.t)/864e5;
    if (d > 0.02){
      const h = halfLife(old), p = Math.pow(2, -d/h), y = ok ? 1 : 0;
      const g = 2*(p - y) * p * d * 0.4805 / h;            /* 0.4805 = (ln 2)² */
      const x = {b:1, r:Math.sqrt(1+old.r), w:Math.sqrt(1+old.w)}, th = {...theta()};
      for (const k of ["b","r","w"]) th[k] = Math.max(-6, Math.min(6, th[k] - 0.05*g*x[k]));
      S.hlr = th;
    }
  }
  if (ok) it.r++; else it.w++; it.t = now; S.mem[key] = it;
}
function dueItems(prefixes){
  return Object.entries(S.mem||{}).filter(([k]) => !prefixes || prefixes.some(p => k.startsWith(p)))
    .map(([k,it]) => ({k, p:recall(it)})).sort((a,b) => a.p - b.p);

const dueCount = prefixes => dueItems(prefixes).filter(x => x.p < 0.5).length;

async function makeOffline(id, onProgress){

function wireLocks(root, redo, H){
  const dis = k => { const i = document.getElementById("lk_" + k), sv = root.querySelector(`[data-lsave="${k}"]`); if (i && sv) sv.disabled = !i.value.trim() || i.value.trim() === H[k].get(); };

  root.querySelectorAll("[data-lchg]").forEach(b => b.onclick = () => { const k = b.dataset.lchg; lockEdit[k] = true; lockDraft[k] = H[k].get(); delete dashNote[k]; redo(); const i = document.getElementById("lk_" + k); if (i){ i.focus(); if (i.select) i.select(); } });

function trackPron(res){
  if (L) L.pronList = (L.pronList || []).concat(res.score);
  if (res.score >= 80){ bumpCnt("speak80"); questProgress("speak80", 1); }
  S.pron = (S.pron || []).concat(res.score).slice(-50);
  S.wpron = S.wpron || {};
  res.words.forEach(w => { if (w.acc == null || w.err === "Omission") return; const k = norm(w.word); const o = S.wpron[k] || {n:0, sum:0}; o.n++; o.sum += w.acc; S.wpron[k] = o; });
  S.sounds = S.sounds || {};
  res.words.forEach(w => w.phonemes.forEach(ph => { if (ph.acc == null || !ph.ph) return; const o = S.sounds[ph.ph] || {n:0, sum:0}; o.n++; o.sum += ph.acc; S.sounds[ph.ph] = o; }));
}

function backupData(){
  save();
  const learners = P.profiles.map(p => { const s = clone(stateOf(p.id, "ru")), es = clone(stateOf(p.id, "es")); delete s.azKey; delete es.azKey; return {profile:p, state:s, stateEs:es}; });
  return {app:"misha-russian", kind:"backup", version:APP_VERSION, saved:new Date().toISOString(), current:P.current,
          settings:{theme:P.theme||"light", vibe:P.vibe!==false, region:P.az.region, voice:P.az.voice, voiceEs:P.az.voiceEs, family:P.family||null, rewards:P.rewards||[]}, learners};
}
async function exportBackup(){
  const data = JSON.stringify(backupData(), null, 1);
  const name = `mishaling-backup-${todayKey()}.json`;
  const file = new File([data], name, {type:"application/json"});
  const stamp = () => { P.lastBackup = new Date().toISOString(); saveP(); };
  try {
    if (navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:"Mishaling backup"}); stamp(); toast("Backup ready. Keep it somewhere safe, like Google Drive."); return true; }
  } catch(e){ if (e && e.name==="AbortError") return false; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  stamp(); toast("Backup saved to Downloads."); return true;
}
function importBackup(file, after){

    const summary = d.learners.map(x => { const s = x.state || {}, us = UNIT_IDS.map(u => `Unit ${u}: ${(s[doneKey(u)]||[]).reduce((a,b) => a+b, 0)}/10`).join(" · ");
      return `<div class="wordrow"><div class="p">${x.profile.avatar}</div><div class="w"><b>${esc(x.profile.name)}</b><small>🇷🇺 ⭐ ${s.stars||0} · letters ${s.alpha||0}/6 · ${us}${x.stateEs ? ` · 🇪🇸 ⭐ ${x.stateEs.stars||0} · sounds ${x.stateEs.alpha||0}/6` : ""}</small></div></div>`; }).join("");
    const bg = sheet(`<h2>Restore backup?</h2><p class="sub" style="margin:0 0 8px">Saved ${new Date(d.saved).toLocaleString()} (app version ${esc(d.version||"?")}). It contains:</p>${summary}
      <p class="note" style="text-align:left;margin:12px 0 0">This replaces all learners on this device. Your Microsoft key stays as it is.</p>
      <div style="display:grid;gap:10px;margin-top:12px"><button class="btn" id="rsGo">Replace and restore</button><button class="btn ghost" data-close>Cancel</button></div>`, true);
    $("#rsGo",bg).onclick = () => {
      P.profiles.forEach(p => { try { localStorage.removeItem(stKey(p.id, "ru")); localStorage.removeItem(stKey(p.id, "es")); } catch(_){} });
      P.profiles = d.learners.map(x => x.profile);
      d.learners.forEach(x => { writeS(x.profile.id, "ru", x.state); if (x.stateEs) writeS(x.profile.id, "es", x.stateEs); });
      P.current = P.profiles.some(p => p.id===d.current) ? d.current : P.profiles[0].id;
      if (d.settings){ P.theme = d.settings.theme || P.theme; P.vibe = d.settings.vibe; if (d.settings.family) P.family = d.settings.family; if (d.settings.rewards) P.rewards = d.settings.rewards; }

/* ---------- 10. Statistics: every word graded A to F ---------- */
function wordStats(s, w){
  const it = (s.mem||{})["w:" + w.id];
  if (!it) return null;
  const th = s.hlr || HLR0, hl = Math.min(274, Math.max(1/96, Math.pow(2, th.b + th.r*Math.sqrt(1+it.r) + th.w*Math.sqrt(1+it.w))));
  const memory = Math.round(100*Math.pow(2, -((Date.now() - it.t)/864e5) / hl));
  const accuracy = (it.r + it.w) ? Math.round(100*it.r/(it.r + it.w)) : null;
  const toks = plain(w.ru).toLowerCase().replace(/[?!.,]/g,"").split(/\s+/).filter(Boolean);
  const pr = toks.map(k => (s.wpron||{})[norm(k)]).filter(Boolean);
  const pron = pr.length ? Math.round(pr.reduce((a,o) => a + o.sum/o.n, 0) / pr.length) : null;
  let score;
  if (accuracy == null && pron == null) score = null;
  else if (pron == null) score = Math.round(0.55*memory + 0.45*(accuracy ?? memory));
  else score = Math.round(0.4*pron + 0.35*memory + 0.25*(accuracy ?? memory));
  return {memory, accuracy, pron, score, right:it.r, wrong:it.w};
}

};
function useCourse(c){
  const C = COURSES[c] || COURSES.ru; CC = COURSES[c] ? c : "ru";
  UNITS = C.units; UNIT_IDS = C.unitIds; ALLWORDS = UNIT_IDS.flatMap(u => UNITS[u].words); ALLSENT = UNIT_IDS.flatMap(u => UNITS[u].sentences);

  setUnit(UNITS[CU] ? CU : UNIT_IDS[0]);
}
/* run fn with another course's content loaded, then switch back */
function withContent(c, fn){ const old = CC, oldU = CU; if (c===old) return fn(); useCourse(c); try { return fn(); } finally { useCourse(old); if (UNITS[oldU]) setUnit(oldU); } }
/* ---------- Tablet: when installed on a big screen, the whole layout scales up to fill it (phones stay as they are) ---------- */
function fitScreen(force){
  const st = force || matchMedia("(display-mode: standalone)").matches || matchMedia("(display-mode: fullscreen)").matches || navigator.standalone;
  const w = window.innerWidth, h = document.documentElement;
  if (st && w >= 700){ const z = w / 560; h.style.zoom = String(z); h.style.setProperty("--z", z); h.classList.add("tab"); }
  else { h.style.zoom = ""; h.style.removeProperty("--z"); h.classList.remove("tab"); }
}
fitScreen(); window.addEventListener("resize", () => fitScreen());
