<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Mishaling: Russian units 21–30, listening</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>
:root{--bg:#fbf6ee;--card:#fff;--ink:#2b1d10;--mute:#7a6650;--line:#e6d9c5;--acc:#8a4f1d;--on:#f3e3cc;--st:#c0392b;--em:#d4770a;--so:#7d3fb0;--stb:#fbe3df;--emb:#fdebd0;--sob:#eadcf6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1610;--card:#2a2018;--ink:#f1e6d6;--mute:#b3a08a;--line:#43362a;--acc:#e0a468;--on:#3b2b1c;--st:#ff8a7a;--em:#ffb25c;--so:#c79cf0;--stb:#4a2622;--emb:#4a3416;--sob:#35244a}}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 130px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:720px;margin:auto}
header{padding:12px 14px 0}h1{font-size:18px;margin:0}p.s{margin:2px 0 8px;color:var(--mute);font-size:13px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding:6px 12px 8px;border-bottom:1px solid var(--line)}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}nav button{flex:0 0 auto;padding:6px 11px;font-size:15px;position:relative}
nav button i{position:absolute;top:-4px;right:-4px;background:var(--st);color:#fff;border-radius:9px;font-size:11px;font-style:normal;padding:0 5px;line-height:16px}
button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:9px 13px;font:inherit}
button.p,nav button[aria-pressed=true]{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.ctl{display:flex;gap:6px;flex-wrap:wrap}.ctl button{padding:8px 11px;font-size:15px}
main{padding:10px 14px 60px}h2{font-size:17px;margin:4px 0 8px}
.l{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0}.l.on{background:var(--on);outline:2px solid var(--acc)}.l.fl{border-color:var(--st)}
.top{display:flex;gap:10px;align-items:flex-start}.n{color:var(--mute);width:24px;flex:0 0 24px}.mid{flex:1}
.w{font-size:12px;color:var(--mute)}.ru{font-size:19px;font-weight:600;line-height:2}.ru span.wd{display:inline-block;padding:0 4px;margin:0 1px;border-radius:7px;cursor:pointer;border:1px dashed transparent}
.ru span.wd:active{border-color:var(--acc)}.wd.stress{background:var(--stb);color:var(--st);border-color:var(--st)}.wd.emphasis{background:var(--emb);color:var(--em);border-color:var(--em)}.wd.sound{background:var(--sob);color:var(--so);border-color:var(--so)}.wd.other,.tag.other{background:var(--on);color:var(--acc);border-color:var(--acc)}.sv{font-size:13px;color:var(--mute);min-height:18px}.cmt{width:100%;margin-top:6px;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;font-size:15px}
.en{display:block;color:var(--mute);font-size:14px}.btns{display:flex;flex-direction:column;gap:6px;flex:0 0 auto}.btns button{padding:7px 11px;font-size:15px}
.fb{background:var(--stb);color:var(--st);border-color:var(--st)!important}
.panel{margin-top:8px;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}.panel .q{font-size:14px;margin-bottom:6px;color:var(--mute)}
.opts{display:flex;gap:6px;flex-wrap:wrap}.opts button{font-size:15px;padding:7px 10px}.panel input{width:100%;margin-top:8px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;font-size:15px}
.tag{display:inline-block;font-size:13px;margin:4px 6px 0 0;padding:1px 8px;border-radius:9px}.tag.stress{background:var(--stb);color:var(--st)}.tag.emphasis{background:var(--emb);color:var(--em)}.tag.sound{background:var(--sob);color:var(--so)}.tag.whole{background:var(--stb);color:var(--st)}
.key{font-size:13px;color:var(--mute);margin:0 0 8px}.rep{white-space:pre-wrap;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:14px;margin:8px 0}
</style></head><body><header><h1>Russian units 21–30: listening</h1><p class="s">Trial: sent with no stress marks. <b>Unflagged = right.</b> Tap a word to flag it, or tap “Flag line” for the whole line.</p></header>
<div class="bar"><nav id="nav"></nav><div class="ctl"><button class="p" id="pu">Play unit</button><button id="all">Play all</button><button id="rs">Restart unit</button><button id="st">Stop</button><button id="fo">Flagged only</button><button id="rp">Report</button></div></div>
<main id="main"></main>
<script>
const U=__U__;let cu=0,ci=-1,mode='',a=new Audio(),only=false,sel=null,F={},db=null,saveState='';
const nav=document.getElementById('nav'),main=document.getElementById('main');
const TYPES={stress:'Wrong stress',emphasis:'Wrong emphasis (changes meaning)',sound:'Wrong sound or word',other:'Something else'};
const WHOLE={meaning:'Meaning or emphasis is off',tone:'Tone is wrong',voice:'Sounds like a different character',other:'Other'};
const key=(u,n)=>'u'+u+'_'+n;
function lsLoad(){try{F=JSON.parse(localStorage.getItem('mishaling_flags')||'{}')}catch(e){F={}}}
function lsSave(){try{localStorage.setItem('mishaling_flags',JSON.stringify(F))}catch(e){}}
function words(l){return l.ru.split(/\s+/).filter(Boolean)}
function count(ui){return U[ui].lines.filter(l=>F[key(U[ui].u,l.n)]).length}
async function persist(u,n,cb,expect){const k=key(u,n),v=F[k];lsSave();if(!db){cb&&cb(false,'Saved on this phone only (no online storage)');return}const ref=db.doc('flags/'+k);
 try{if(v){await ref.set(v);if(cb){const g=await ref.get();const d=g&&(g.data?g.data():g.value||g);const ok=!!d&&((d.comment||'')===(expect===undefined?(v.comment||''):expect));cb(ok,ok?'Saved ✓':'Not saved online. Try again.')}}else{await ref.delete();cb&&cb(true,'Saved ✓')}}
 catch(e){cb&&cb(false,'Not saved online: '+(e&&e.message||'error'))}}
function head(){document.getElementById('rp').textContent='Report ('+Object.keys(F).length+')';[...nav.children].forEach((b,i)=>{const c=count(i);b.innerHTML=(U[i].u==99?'Ph':U[i].u)+(c?'<i>'+c+'</i>':'')})}
U.forEach((x,i)=>{const b=document.createElement('button');b.dataset.i=i;b.textContent=x.u==99?'Ph':x.u;nav.appendChild(b)});
function lineHtml(l,i){const k=key(U[cu].u,l.n),f=F[k]||{};const ws=words(l).map((w,j)=>{const t=f.words&&f.words[j];return `<span class="wd ${t?t.type:''}" data-i="${i}" data-j="${j}">${w}</span>`}).join(' ');
 let tags='';if(f.words)for(const j in f.words){const t=f.words[j];tags+=`<span class="tag ${t.type}">${words(l)[j]}: ${TYPES[t.type].split(' (')[0]}${t.note?' – '+esc(t.note):''}</span>`}
 if(f.whole)tags+=`<span class="tag whole">Line: ${WHOLE[f.whole.type]}${f.whole.note?' – '+esc(f.whole.note):''}</span>`;
 let panel='';if(sel&&sel.i===i){if(sel.j!=null){const cur=(f.words&&f.words[sel.j])||{};panel=`<div class="panel"><div class="q">“${words(l)[sel.j]}”: what is wrong?</div><div class="opts">${Object.keys(TYPES).map(t=>`<button data-act="w" data-t="${t}" class="${cur.type==t?'p':''}">${TYPES[t]}</button>`).join('')}${cur.type?'<button data-act="wclear">Remove flag</button>':''}</div><div class="opts" style="margin-top:8px"><button class="p" data-act="done">Done</button></div></div>`}
  else{const cur=f.whole||{};panel=`<div class="panel"><div class="q">Whole line: what is wrong?</div><div class="opts">${Object.keys(WHOLE).map(t=>`<button data-act="h" data-t="${t}" class="${cur.type==t?'p':''}">${WHOLE[t]}</button>`).join('')}${cur.type?'<button data-act="hclear">Remove flag</button>':''}</div><div class="opts" style="margin-top:8px"><button class="p" data-act="done">Done</button></div></div>`}}
 return `<div class="l ${i==ci?'on':''} ${F[k]?'fl':''}" id="l${i}"><div class="top"><span class="n">${l.n}</span><div class="mid"><span class="w">${l.who}</span><div class="ru">${ws}</div><span class="en">${l.en}</span>${tags}<input class="cmt" data-i="${i}" placeholder="Note for this line (saves by itself)" value="${esc(f.comment||'')}"><div class="sv" id="sv${i}">${f.comment?'Saved ✓':''}</div></div><div class="btns">${l.b?`<button class="p" data-act="play" data-i="${i}" data-part="a">Normal</button><button class="p" data-act="play" data-i="${i}" data-part="b">Slow</button>`:`<button class="p" data-act="play" data-i="${i}">Play</button>`}<button class="${f.whole?'fb':''}" data-act="fl" data-i="${i}">Flag line</button></div></div>${panel}</div>`}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){[...nav.children].forEach((b,i)=>b.setAttribute('aria-pressed',i==cu));const x=U[cu];
 main.innerHTML=`<h2>${x.u==99?'':'Unit '+x.u+': '}${x.t}. ${x.st}</h2><p class="key"><span class="tag stress">stress</span><span class="tag emphasis">emphasis</span><span class="tag sound">sound</span> ${saveState}</p>`+x.lines.map((l,i)=>(only&&!F[key(x.u,l.n)]&&!(sel&&sel.i===i))?'':lineHtml(l,i)).join('')||'';head()}
let cp='a';function play(u,i,part){cp=part||'a';if(cu!==u){cu=u;sel=null;render()}ci=i;document.querySelectorAll('.l').forEach(e=>e.classList.remove('on'));const e=document.getElementById('l'+i);if(e){e.classList.add('on');e.scrollIntoView({block:'center',behavior:'smooth'})}a.pause();a.src=U[u].lines[i][cp==='b'?'b':'a'];a.play()}
nav.onclick=e=>{const b=e.target.closest('button');if(!b)return;mode='';a.pause();cu=+b.dataset.i;ci=-1;sel=null;render();window.scrollTo(0,0)};
main.onclick=e=>{const wd=e.target.closest('.wd');if(wd){sel={i:+wd.dataset.i,j:+wd.dataset.j};render();return}
 const b=e.target.closest('button[data-act]');if(!b)return;const act=b.dataset.act,u=U[cu].u;
 if(act=='play'){mode='';play(cu,+b.dataset.i,b.dataset.part);return}
 if(act=='fl'){sel={i:+b.dataset.i,j:null};render();return}
 if(act=='done'){sel=null;render();return}
 const l=U[cu].lines[sel.i],k=key(u,l.n);let f=F[k]||{unit:u,line:l.n,text:l.sent,words:{}};f.words=f.words||{};const note=act=='w'?((f.words[sel.j]||{}).note||''):((f.whole||{}).note||'');
 if(act=='w'){f.words[sel.j]={type:b.dataset.t,word:words(l)[sel.j],note}}
 if(act=='wclear'){delete f.words[sel.j]}
 if(act=='h'){f.whole={type:b.dataset.t,note}}
 if(act=='hclear'){delete f.whole}
 if(!f.whole&&!Object.keys(f.words).length&&!f.comment)delete F[k];else F[k]=f;persist(u,l.n);if(act=='wclear'||act=='hclear')sel=null;render()};
let ct={};function saveComment(i){const u=U[cu].u,l=U[cu].lines[i],k=key(u,l.n),el=document.querySelector('.cmt[data-i="'+i+'"]');if(!el)return;const v=el.value.trim();const sv=document.getElementById('sv'+i);
 let f=F[k]||{unit:u,line:l.n,text:l.sent,words:{}};f.words=f.words||{};if(v)f.comment=v;else delete f.comment;
 if(!f.whole&&!Object.keys(f.words).length&&!f.comment)delete F[k];else F[k]=f;if(sv)sv.textContent='Saving…';persist(u,l.n,(ok,msg)=>{const e=document.getElementById('sv'+i);if(e)e.textContent=msg;head()},v)}
main.addEventListener('input',e=>{const t=e.target;if(t.classList&&t.classList.contains('cmt')){const i=+t.dataset.i;clearTimeout(ct[i]);const sv=document.getElementById('sv'+i);if(sv)sv.textContent='Typing…';ct[i]=setTimeout(()=>saveComment(i),700)}});
main.addEventListener('focusout',e=>{const t=e.target;if(t.classList&&t.classList.contains('cmt')){const i=+t.dataset.i;clearTimeout(ct[i]);saveComment(i)}});
let nt=null;function saveNote(){const n=document.getElementById('note');if(!n||!sel)return;const u=U[cu].u,l=U[cu].lines[sel.i],k=key(u,l.n),note=n.value;
 let f=F[k]||{unit:u,line:l.n,text:l.sent,words:{}};f.words=f.words||{};
 if(sel.j!=null){const w=f.words[sel.j];if(w)w.note=note;else if(note)f.words[sel.j]={type:'other',word:words(l)[sel.j],note};else return}
 else{if(f.whole)f.whole.note=note;else if(note)f.whole={type:'other',note};else return}
 F[k]=f;persist(u,l.n);head()}
main.addEventListener('input',e=>{if(e.target.id==='note'){clearTimeout(nt);nt=setTimeout(saveNote,500)}});
main.addEventListener('change',e=>{if(e.target.id==='note'){clearTimeout(nt);saveNote()}});
main.addEventListener('focusout',e=>{if(e.target.id==='note'){clearTimeout(nt);saveNote()}});
document.getElementById('pu').onclick=()=>{mode='unit';play(cu,Math.max(ci,0))};
document.getElementById('rs').onclick=()=>{mode='unit';play(cu,0)};
document.getElementById('all').onclick=()=>{mode='all';play(cu,0)};
document.getElementById('st').onclick=()=>{mode='';a.pause()};
document.getElementById('fo').onclick=e=>{only=!only;e.target.classList.toggle('p',only);sel=null;render()};
document.getElementById('rp').onclick=()=>{let t='';U.forEach(x=>x.lines.forEach(l=>{const f=F[key(x.u,l.n)];if(!f)return;t+=`Unit ${x.u}, line ${l.n}: ${l.sent}\n`;if(f.comment)t+=`  - note: ${f.comment}\n`;for(const j in (f.words||{})){const w=f.words[j];t+=`  - word “${w.word}”: ${TYPES[w.type]}${w.note?' ('+w.note+')':''}\n`}if(f.whole)t+=`  - whole line: ${WHOLE[f.whole.type]}${f.whole.note?' ('+f.whole.note+')':''}\n`}));
 const d=document.createElement('div');d.className='rep';d.textContent=t||'Nothing flagged yet: every line counts as right.';main.prepend(d);d.scrollIntoView()};
a.onended=()=>{if(!mode)return;if(cp==='a'&&U[cu].lines[ci].b){setTimeout(()=>play(cu,ci,'b'),700);return}const n=U[cu].lines.length;if(ci<n-1)setTimeout(()=>play(cu,ci+1),450);else if(mode=='all'&&cu<U.length-1)setTimeout(()=>play(cu+1,0),900);else mode=''};
lsLoad();render();
(async()=>{try{const c=window.claude&&await window.claude.use('db');if(!c)return;db=c;const snap=await db.collection('flags').get();snap.docs.forEach(d=>{F[d.id]=JSON.parse(JSON.stringify(d.data()))});lsSave();
 Object.keys(F).forEach(k=>{const m=k.match(/^u(\d+)_(\d+)$/);if(m&&F[k]&&F[k].words===undefined)F[k].words={}});render()}catch(e){}})();
</script></body></html>
